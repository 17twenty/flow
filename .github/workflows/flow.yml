# flow gates flow. Adapted by hand from assets/templates/ci/github-flow.yml
# (spec 17 §5 Stage B): flow is what is in the checkout, so every job builds
# the binary from the commit it is judging rather than installing a release.
# A pull request is therefore gated by the flow it contains, which is the
# whole of what dogfooding is for.
name: flow
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  push: {}                        # sync on the trunk; other branches skip every job
  schedule:
    - cron: '17 6 * * *'          # daily doctor; the 14-day streak is read from the health issue
    - cron: '41 * * * *'          # hourly sync
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write            # policy explanation comment
  statuses: write                 # flow/policy
  issues: write                   # follow-ups + pinned health issue

concurrency:
  group: flow-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FLOW_PROJECT_TOKEN: ${{ secrets.FLOW_PROJECT_TOKEN }}   # classic PAT: 'project', plus 'repo' for the daily audit
  FLOW_LOG_FORMAT: json

jobs:
  gate:
    name: policy
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    # Arming a merge is arranging a write to the trunk, so GitHub's
    # `enablePullRequestAutoMerge` refuses a token that may only read (#190).
    # This job holds `contents: write` for that one request and writes nothing
    # to the tree itself: what it asks is that the forge land the pull request
    # once the approval and the checks it waits for are in (spec 09 §1). A
    # job's block replaces the workflow's whole set, so the rest is repeated.
    permissions:
      contents: write             # arm auto-merge
      pull-requests: write        # policy explanation comment
      statuses: write             # flow/policy
      issues: write               # follow-ups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build -o bin/flow .
      - run: ./bin/flow check pr
      # Settle what the last merge left behind (spec 20 §3). It never fails
      # the gate: the status above is the verdict.
      - run: ./bin/flow sync || [ $? -eq 2 ]
        continue-on-error: true
        env:
          # Bringing a branch up to date is a push, and GitHub starts no
          # checks for a push made with the Actions token (issue #240), so
          # sync acts with the credential the daily job reads with.
          GITHUB_TOKEN: ${{ secrets.FLOW_PROJECT_TOKEN }}

  sync:
    name: sync
    # A push to the trunk where the forge delivers it, and an hourly backstop
    # where it does not (spec 20 §3).
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'schedule' && github.event.schedule == '41 * * * *')
    runs-on: ubuntu-latest
    env:
      # As above: an update made with the Actions token starts no checks.
      GITHUB_TOKEN: ${{ secrets.FLOW_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build -o bin/flow .
      - run: ./bin/flow sync || [ $? -eq 2 ]

  config:
    name: setup checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # Only when the pull request touches what flow is configured by: the
      # setup checks read the providers, and running them on every change to
      # every file would spend an API budget to learn nothing (spec 07 §4).
      - id: touched
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qE '^\.flow\.(yaml|lock)$'; then
            echo "flow=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.touched.outputs.flow == 'true'
        run: go build -o bin/flow . && ./bin/flow doctor --ci --check 'config.*' --check 'lock.*'

  health:
    name: daily health
    if: (github.event_name == 'schedule' && github.event.schedule == '17 6 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # The audit reads what protects the trunk, and GitHub does not let a
      # workflow grant the Actions token the `administration` permission, so
      # `secrets.GITHUB_TOKEN` answers 403 to every protection and ruleset
      # read. A run that could not look is not a green run, so the daily job
      # uses the same credential a person would (spec 07 §10).
      GITHUB_TOKEN: ${{ secrets.FLOW_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build -o bin/flow .
      # Exit 2 is "flow found something somebody must do", which is a report,
      # not a broken job. Anything else fails the run.
      - run: ./bin/flow doctor --ci --fix --timeout 10m --report doctor.md || [ $? -eq 2 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: doctor-report, path: doctor.md }
