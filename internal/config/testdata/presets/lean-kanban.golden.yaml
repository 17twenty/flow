version: 1
preset: lean-kanban
forge:
    type: github
    repo: owner/name
    url: https://github.com
    auth:
        token_env: GITHUB_TOKEN
tracker:
    type: github-projects
    owner: owner
    owner_type: user
    project: ${pending:project}
    auth:
        token_env: FLOW_PROJECT_TOKEN
workflow:
    done_on: merged
    columns:
        - id: backlog
          name: Backlog
          category: todo
        - id: ready
          name: Ready
          category: todo
          gate: definition_of_ready
        - id: in_progress
          name: In progress
          category: in_progress
          wip:
            per_person: 2
        - id: in_review
          name: In review
          category: in_progress
          wip:
            limit: 3
        - id: done
          name: Done
          category: done
    transitions:
        changes_requested:
            to: in_progress
            owner: native
        issue_closed:
            to: done
            owner: flow
        pr_merged:
            to: done
            owner: flow
        pr_opened_draft:
            to: in_progress
            owner: flow
        pr_ready_for_review:
            to: in_review
            owner: flow
    expedite:
        labels:
            - incident
        max: 1
    blocked:
        label: blocked
        require_comment: true
definition_of_ready:
    rules:
        - acceptance_criteria
        - parent_link
        - not_blocked
commits:
    convention: conventional
    types:
        - feat
        - fix
        - perf
        - refactor
        - test
        - docs
        - build
        - ci
        - chore
        - revert
        - style
    header_max: 72
    merge_strategy: squash
    scopes: {}
    unlinked_types:
        - ci
        - build
        - chore
        - docs
deploys:
    source: forge_deployments
    environment: production
    max_lag: 2h
    max_age: 7d
policy:
    status_context: flow/policy
    strictness: standard
    comment: on_failure
agents:
    labels:
        - agent
    require_human_review: true
followups:
    labels:
        - flow-followup
    owners:
        default: ${pending:owners.default}
        tracker_admin: ${pending:owners.tracker_admin}
        forge_admin: ${pending:owners.forge_admin}
        platform: ${pending:owners.platform}
attestation:
    default_ttl: 30d
