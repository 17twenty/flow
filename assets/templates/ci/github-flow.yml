# Written by `flow init`. flow gate (check pr), deploy transitions (check deploy), daily health (doctor).
name: flow
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  deployment_status: {}           # only used when done_on: deployed
  schedule:
    - cron: '17 6 * * *'          # daily doctor
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write            # policy explanation comment
  statuses: write                 # flow/policy
  issues: write                   # follow-ups + pinned health issue

concurrency:
  group: flow-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FLOW_PROJECT_TOKEN: ${{ secrets.FLOW_PROJECT_TOKEN }}   # classic PAT: 'project', plus 'repo' for the daily audit
  FLOW_LOG_FORMAT: json
  FLOW_VERSION: latest            # init writes the build that wrote this; bump deliberately

jobs:
  gate:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go install github.com/17twenty/flow@${FLOW_VERSION}
      - run: flow check pr

  deploy:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go install github.com/17twenty/flow@${FLOW_VERSION}
      - run: flow check deploy

  config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with: { filters: "flow: ['.flow.yaml', '.flow.lock']" }
      - uses: actions/setup-go@v5
        if: steps.f.outputs.flow == 'true'
        with: { go-version: stable }
      - if: steps.f.outputs.flow == 'true'
        run: go install github.com/17twenty/flow@${FLOW_VERSION} && flow doctor --ci --check 'config.*' --check 'lock.*'

  health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # The audit reads what protects the trunk, and GitHub does not let a
      # workflow grant the Actions token the `administration` permission, so
      # `secrets.GITHUB_TOKEN` answers 403 to every protection and ruleset
      # read. A run that could not look is not a green run, so the daily job
      # uses the same credential a person would (spec 07 §10).
      GITHUB_TOKEN: ${{ secrets.FLOW_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go install github.com/17twenty/flow@${FLOW_VERSION}
      - run: flow doctor --ci --fix --report doctor.md || [ $? -eq 2 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: doctor-report, path: doctor.md }
